<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Magia y Poesía</title>
  
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Magia y Poesía">
  <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=192&h=192&fit=crop">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #050505;
      color: #e5e5e5;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo con efecto de nebulosa y destellos dorados mágicos y profundos */
    .bg-nebula {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .nebula-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(191, 149, 63, 0.12) 0%, rgba(115, 89, 31, 0.04) 40%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    }

    h1 {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.15em;
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(191, 149, 63, 0.4));
    }

    .gold-border {
      border: 1px solid rgba(191, 149, 63, 0.35);
    }

    .gold-glow {
      box-shadow: 0 0 60px rgba(191, 149, 63, 0.2), inset 0 0 30px rgba(191, 149, 63, 0.12);
    }

    .vinyl-spin {
      animation: spin 16s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .paused-anim {
      animation-play-state: paused !important;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-6 relative selection:bg-amber-500/30">

  <!-- Fondo de Nebulosa Mística -->
  <div class="bg-nebula">
    <div class="nebula-glow"></div>
  </div>

  <!-- Elemento oculto para escaneo DOM -->
  <div id="extassisnetwork" style="display:none;"></div>

  <!-- Cabecera Limpia de Lujo -->
  <header class="text-center mt-6 z-10 w-full max-w-lg">
    <h1 class="text-2xl sm:text-3xl font-bold uppercase gold-gradient-text mb-3">
      Radio Magia y Poesía
    </h1>
    
    <!-- Anuncio de canción actual -->
    <div class="inline-flex items-center gap-2.5 px-5 py-2 rounded-full bg-neutral-950/85 gold-border shadow-2xl backdrop-blur-md">
      <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
      <span id="liveSongTitle" class="text-neutral-300 text-xs sm:text-sm font-light tracking-wide truncate max-w-[260px]">Sintonizando esencia...</span>
    </div>
  </header>

  <!-- Contenido Central: Vinilo Gigante Centrado -->
  <main class="w-full max-w-md my-auto flex flex-col items-center z-10 py-4">
    
    <div class="relative w-64 h-64 sm:w-72 sm:h-72 rounded-full p-2.5 bg-neutral-900/40 gold-glow flex items-center justify-center mb-10">
      <div id="vinylDisk" class="w-full h-full rounded-full bg-neutral-950 gold-border flex items-center justify-center relative shadow-2xl vinyl-spin paused-anim overflow-hidden">
        
        <!-- Carátula de música en alta definición -->
        <img id="songCover" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&h=500&fit=crop" alt="Carátula" class="absolute inset-0 w-full h-full object-cover opacity-70 transition-opacity duration-700">
        
        <!-- Textura de vinilo negro profundo -->
        <div class="absolute inset-0 bg-[radial-gradient(circle,transparent_30%,rgba(5,5,5,0.95)_85%)] pointer-events-none"></div>
        <div class="absolute inset-6 rounded-full border border-amber-500/10 pointer-events-none"></div>
        <div class="absolute inset-14 rounded-full border border-amber-500/10 pointer-events-none"></div>
        
        <!-- Etiqueta central dorada -->
        <div class="w-16 h-16 rounded-full bg-gradient-to-br from-amber-600 via-amber-700 to-neutral-950 p-0.5 flex items-center justify-center shadow-2xl z-10 gold-border">
          <div class="w-full h-full rounded-full bg-neutral-950 flex items-center justify-center">
            <i class="fa-solid fa-compact-disc text-amber-400/90 text-lg"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Botón de Reproducción Minimalista Dorado -->
    <div class="flex items-center justify-center mb-8">
      <button id="btnPlay" class="w-20 h-20 rounded-full bg-neutral-950 hover:bg-neutral-900 text-amber-400 text-2xl flex items-center justify-center shadow-2xl transform active:scale-95 transition duration-300 gold-border group">
        <i id="playIcon" class="fa-solid fa-play ml-1 group-hover:scale-110 transition-transform"></i>
      </button>
    </div>

    <!-- Oyentes Conectados -->
    <div class="text-xs text-neutral-400 tracking-wider font-light flex items-center gap-2 bg-neutral-950/70 px-4 py-1.5 rounded-full gold-border backdrop-blur-sm">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
      <span>Oyentes: <strong id="listenersCount" class="font-medium text-amber-300">0</strong></span>
    </div>

  </main>

  <!-- Pie Minimalista -->
  <footer class="text-center text-[11px] text-neutral-500 tracking-widest uppercase z-10 mb-2">
    <span>SEÑAL ONLINE RADIO MAGIA Y POESIA</span>
  </footer>

  <!-- Elemento de audio -->
  <audio id="audioStream" src="https://streaming.viphosting.cl:8236/;stream.mp3" preload="none"></audio>

  <script>
    const audio = document.getElementById('audioStream');
    const btnPlay = document.getElementById('btnPlay');
    const playIcon = document.getElementById('playIcon');
    const vinylDisk = document.getElementById('vinylDisk');
    const elementListeners = document.getElementById('listenersCount');
    const songCover = document.getElementById('songCover');

    let isPlaying = false;
    let ultimaCancionProcesada = "";

    btnPlay.addEventListener('click', () => {
      if (isPlaying) {
        audio.pause();
        audio.src = "";
        isPlaying = false;
        playIcon.className = "fa-solid fa-play ml-1 group-hover:scale-110 transition-transform";
        vinylDisk.classList.add('paused-anim');
      } else {
        audio.src = "https://streaming.viphosting.cl:8236/;stream.mp3";
        audio.load();
        audio.play().then(() => {
          isPlaying = true;
          playIcon.className = "fa-solid fa-pause group-hover:scale-110 transition-transform";
          vinylDisk.classList.remove('paused-anim');
        }).catch(err => {
          console.error("Error al reproducir:", err);
        });
      }
    });

    function actualizarCaratula(terminoBusqueda) {
      if (!terminoBusqueda) return;
      const urlItunes = `https://itunes.apple.com/search?term=${encodeURIComponent(terminoBusqueda)}&entity=song&limit=1`;
      
      $.ajax({
        url: urlItunes,
        dataType: 'json',
        success: function(response) {
          if (response.results && response.results.length > 0) {
            let artworkUrl = response.results[0].artworkUrl100;
            if (artworkUrl) {
              artworkUrl = artworkUrl.replace('100x100bb', '800x800bb');
              songCover.src = artworkUrl;
            }
          }
        }
      });
    }

    function procesarNuevaCancion(tituloCrudo) {
      if (!tituloCrudo) return;
      let txt = tituloCrudo.trim();
      
      if (
        txt.length > 2 && 
        !txt.toUpperCase().includes("RADIO") && 
        txt !== ultimaCancionProcesada
      ) {
        ultimaCancionProcesada = txt;
        $("#liveSongTitle").text(txt);
        actualizarCaratula(txt);
      }
    }

    setInterval(() => {
      $("#extassisnetwork").find("div, span, p, a").each(function() {
        const classNames = $(this).attr("class") || "";
        const idName = $(this).attr("id") || "";
        if (
          classNames.includes("song") || 
          classNames.includes("title") ||
          idName.includes("song") ||
          idName.includes("title")
        ) {
          const txt = $(this).text();
          if (txt) {
            procesarNuevaCancion(txt);
          }
        }
      });
    }, 1500);

    function actualizarEstadisticas() {
      $.ajax({
        url: "https://streaming.viphosting.cl:8236/stats?sid=1&json=1",
        dataType: "jsonp",
        jsonpCallback: "parseMusicStats",
        timeout: 2500,
        success: function(data) {
          if (data) {
            if (data.currentlisteners !== undefined && elementListeners) {
              elementListeners.innerText = data.currentlisteners;
            }
            if (data.songtitle) {
              procesarNuevaCancion(data.songtitle);
            }
          }
        },
        error: function() {
          $.ajax({
            url: "https://corsproxy.io/?" + encodeURIComponent("https://streaming.viphosting.cl:8236/stats?sid=1&json=1"),
            dataType: "json",
            timeout: 2000,
            success: function(data) {
              if (data) {
                if (data.currentlisteners !== undefined && elementListeners) {
                  elementListeners.innerText = data.currentlisteners;
                }
                if (data.songtitle) {
                  procesarNuevaCancion(data.songtitle);
                }
              }
            }
          });
        }
      });
    }

    setInterval(actualizarEstadisticas, 10000);
    actualizarEstadisticas();

    // Service Worker PWA
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => e.waitUntil(clients.claim()));
        self.addEventListener('fetch', e => {
          e.respondWith(
            fetch(e.request).catch(() => caches.match(e.request))
          );
        });
      `;
      const swBlob = new Blob([swCode], { type: 'text/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(err => console.log('SW reg failed', err));
    }

    // Manifest PWA dinámico
    const manifestData = {
      "name": "Radio Magia y Poesía",
      "short_name": "Magia y Poesía",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#050505",
      "theme_color": "#050505",
      "icons": [
        {
          "src": "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=192&h=192&fit=crop",
          "sizes": "192x192",
          "type": "image/jpeg"
        },
        {
          "src": "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=512&h=512&fit=crop",
          "sizes": "512x512",
          "type": "image/jpeg"
        }
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
    const manifestURL = URL.createObjectURL(manifestBlob);
    const linkManifest = document.createElement('link');
    linkManifest.rel = 'manifest';
    linkManifest.href = manifestURL;
    document.head.appendChild(linkManifest);
  </script>
</body>
</html>
