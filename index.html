<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADIO MAGIA Y POESIA</title>

  <!-- Enlace a Manifest Físico Obligatorio -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ff007f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Magia y Poesia">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/4dYfKmV9/logo2.jpg">
  
  <!-- Carga de Librerías -->
  <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
  <script src="https://extassisnetwork.com/player/Luna/luna.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --neon-color: #ff007f;
      --purple-neon: #b026ff;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(-45deg, #ff007f, #7928ca, #00f3ff, #39ff14, #ffe600, #ff007f);
      background-size: 400% 400%;
      animation: rainbowBackground 15s ease infinite;
      font-family: 'Be Vietnam', sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    @keyframes rainbowBackground {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      min-height: 100vh;
      padding: 20px 0;
      box-sizing: border-box;
      position: relative;
    }

    .header-title {
      font-size: 28px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 0 5px #ffffff, 0 0 10px var(--purple-neon), 0 0 20px var(--purple-neon), 0 0 40px var(--purple-neon);
      animation: purpleNeonPulse 2s ease-in-out infinite alternate;
    }

    @keyframes purpleNeonPulse {
      from { text-shadow: 0 0 5px #ffffff, 0 0 10px var(--purple-neon), 0 0 20px var(--purple-neon); }
      to { text-shadow: 0 0 5px #ffffff, 0 0 15px var(--purple-neon), 0 0 30px var(--purple-neon), 0 0 50px var(--purple-neon); }
    }

    .listeners-count {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.65);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--neon-color);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      margin-bottom: 10px;
      backdrop-filter: blur(8px);
    }

    .listeners-badge {
      width: 8px;
      height: 8px;
      background-color: #39ff14;
      border-radius: 50%;
      box-shadow: 0 0 8px #39ff14;
      animation: pulseLive 1.5s infinite;
    }

    @keyframes pulseLive {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    .btn-install {
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid var(--neon-color);
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
      transition: all 0.3s ease;
      margin-bottom: 15px;
      z-index: 100;
    }

    .btn-install:hover {
      transform: scale(1.08);
      background: rgba(255, 0, 127, 0.8);
    }

    .player-wrapper {
      width: 95%;
      max-width: 1200px;
      height: 72vh;
      border-radius: 16px;
      position: relative;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }

    #extassisnetwork {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      overflow: hidden;
    }

    .djs-section {
      width: 95%;
      max-width: 1200px;
      overflow: hidden;
      margin-top: 15px;
      margin-bottom: 10px;
      text-align: center;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      padding: 12px 0;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .djs-section h3 {
      font-size: 13px;
      letter-spacing: 2px;
      color: #e0e0e0;
      margin: 0 0 10px 0;
      text-transform: uppercase;
    }

    .djs-track-container {
      display: flex;
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
    }

    .djs-track {
      display: flex;
      gap: 20px;
      align-items: center;
      animation: scrollDjs 25s linear infinite;
    }

    @keyframes scrollDjs {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .dj-card {
      background: rgba(0, 0, 0, 0.7);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 150px;
      border: 1.5px solid var(--neon-color);
    }

    .dj-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--neon-color);
    }

    .dj-name {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <h1 class="header-title">
      <span>📻</span> RADIO MAGIA Y POESIA <span>✨</span>
    </h1>

    <div class="listeners-count">
      <span class="listeners-badge"></span>
      <span>Oyentes:</span>
      <strong id="listenersNum" style="color: var(--neon-color);">--</strong>
    </div>

    <button class="btn-install" id="btnInstall">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
      </svg>
      Instalar App
    </button>

    <div class="player-wrapper">
      <div id="extassisnetwork"></div>
    </div>

    <div class="djs-section">
      <h3>NUESTROS DJS...</h3>
      <div class="djs-track-container">
        <div id="djs-track" class="djs-track">
          <p style="color: #aaa; font-size: 14px; padding: 10px;">Cargando DJs...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Registro SW
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }

    // Evento de Instalación Directa
    let deferredPrompt;
    const btnInstall = document.getElementById('btnInstall');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btnInstall.style.display = 'flex';
    });

    btnInstall.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          btnInstall.style.display = 'none';
        }
        deferredPrompt = null;
      } else {
        alert("Atención:\n\n1. Asegúrate de estar probando el sitio desde tu servidor HTTPS (ej. Netlify/Vercel) y no desde un archivo local.\n2. Si la app ya la instalaste previamente en tu PC, el navegador oculta el evento hasta que la desinstales.");
      }
    });

    if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
      btnInstall.style.display = 'none';
    }

    // Player
    $("#extassisnetwork").lunaradio({
      streamurl: "https://streaming.viphosting.cl:8236",
      radioname: "MAGIA Y POESIA",
      coverimage: "https://i.postimg.cc/4dYfKmV9/logo2.jpg",
      onlycoverimage: false,
      userinterface: "big",
      backgroundcolor: "transparent",
      fontcolor: "#ffffff",
      hightlightcolor: "#ff007f",
      fontname: "Be Vietnam",
      googlefont: "Be Vietnam",
      fontratio: "0.8",
      scroll: "true",
      coverstyle: "animated",
      usevisualizer: "real",
      visualizertype: "4",
      streamtype: "shoutcast2",
      shoutcastpath: "/stream",
      shoutcastid: "1",
      metadatainterval: "5000",
      volume: "100",
      usestreamcorsproxy: "true",
    });

    // Contador Oyentes
    function actualizarOyentes() {
      $.ajax({
        url: "https://streaming.viphosting.cl:8236/stats?json=1",
        dataType: "jsonp",
        success: function(data) {
          $("#listenersNum").text(data && data.currentlisteners !== undefined ? data.currentlisteners : "1");
        },
        error: function() { $("#listenersNum").text("1"); }
      });
    }
    actualizarOyentes();
    setInterval(actualizarOyentes, 10000);

    // Supabase DJs
    const { createClient } = supabase;
    const _supabase = createClient('https://sxgrplnocgbqzprlufas.supabase.co', 'sb_publishable_6kLCYGH8swAJIieVZwEGRQ_weWCCn_R');

    async function cargarDJs() {
      const trackDJs = document.getElementById('djs-track');
      try {
        const { data, error } = await _supabase.from('djs').select('*').limit(12);
        if (error) throw error;
        if (data && data.length > 0) {
          let html = '';
          data.forEach(dj => {
            html += `
              <div class="dj-card">
                <img src="${dj.imagen_url || 'https://via.placeholder.com/45'}" alt="${dj.nombre}" class="dj-avatar">
                <div class="dj-name">${dj.nombre}</div>
              </div>`;
          });
          trackDJs.innerHTML = html + html;
        } else {
          trackDJs.innerHTML = '<p style="color: #aaa; font-size: 14px;">No hay DJs registrados.</p>';
        }
      } catch (err) {
        trackDJs.innerHTML = '<p style="color: #ff6b6b; font-size: 14px;">Error al cargar DJs.</p>';
      }
    }
    document.addEventListener('DOMContentLoaded', cargarDJs);
  </script>
</body>
</html>
