<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADIO MAGIA Y POESIA</title>
  
  <!-- Configuración PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#120c1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Radio Magia & Poesia">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/VNgxvsk0/logo-removebg-preview.png">
  
  <!-- Fuentes Google -->
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Íconos FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
  <script src="https://extassisnetwork.com/player/Luna/luna.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root { 
      --neon-color: #39ff14; 
      --pink-neon: #ff007f;
      --dark-border: #1a1528;
    }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #0d0914, #180e29, #0a192f, #1a0826);
      background-size: 400% 400%;
      animation: bgGradientAnimation 15s ease infinite;
      font-family: 'Be Vietnam', sans-serif; color: #ffffff; overflow-x: hidden;
    }
    @keyframes bgGradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .main-container {
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: flex-start;
      width: 100vw; 
      min-height: 100vh; 
      padding: 10px; 
      box-sizing: border-box; 
      position: relative;
      gap: 12px;
    }

    /* BANNER SUPERIOR */
    .live-dj-banner {
      width: 100%; 
      max-width: 100%; 
      background: rgba(15, 12, 25, 0.85);
      border: 2px solid var(--dark-border); 
      border-radius: 12px; 
      padding: 16px 16px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      box-sizing: border-box;
      backdrop-filter: blur(10px); 
      position: relative; 
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    }

    /* CONTENEDOR DEL REPRODUCTOR */
    .player-wrapper {
      width: 100%; 
      max-width: 100%; 
      background: rgba(15, 12, 25, 0.7);
      border-radius: 16px; 
      padding: 15px 10px 15px 10px; 
      box-sizing: border-box;
      position: relative; 
      border: 2px solid var(--dark-border); 
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .brand-title-container { 
      display: flex; flex-direction: column; align-items: center; justify-content: center; 
      gap: 6px; text-align: center; width: 100%;
    }

    .brand-header-row {
      display: inline-flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
    }

    .brand-icon { 
      font-size: 36px; filter: drop-shadow(0 0 10px var(--pink-neon)); 
      animation: floatIcon 2s ease-in-out infinite alternate; flex-shrink: 0; 
    }
    @keyframes floatIcon { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-4px) scale(1.1); } }
    
    .brand-title {
      font-family: 'Be Vietnam', sans-serif;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff007f, #00f3ff, #39ff14, #ff007f);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowText 4s linear infinite;
      filter: drop-shadow(0 0 14px rgba(255, 0, 127, 0.6)) drop-shadow(0 0 25px rgba(0, 243, 255, 0.4));
      margin: 0;
      text-align: center;
      line-height: 1.15;
    }
    
    /* CONTENEDOR DE ESTADÍSTICAS Y ESTADO (Columna Vertical) */
    .stats-flex-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      z-index: 10;
      position: relative;
    }

    /* CONTADOR DE OYENTES */
    .live-listeners-count {
      font-size: 13px; 
      color: #dddddd; 
      font-weight: 600; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 6px;
      background: rgba(0, 0, 0, 0.5); 
      padding: 6px 14px; 
      border-radius: 20px; 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.9));
    }
    .live-listeners-count span { color: var(--neon-color); font-weight: 800; }

    /* INDICADOR DE ESTADO EN VIVO (Ubicado debajo del contador) */
    .stream-status-badge {
      font-size: 11px;
      font-weight: 800;
      color: var(--neon-color);
      background: rgba(0, 0, 0, 0.5);
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(57, 255, 20, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 1px;
      filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.9));
    }
    .status-dot {
      width: 7px;
      height: 7px;
      background-color: var(--neon-color);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--neon-color);
      animation: blinkStatus 1.2s infinite ease-in-out;
    }
    @keyframes blinkStatus {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* CONTENEDOR DE LUNA RADIO */
    #extassisnetwork { 
      width: 100%; 
      height: 400px !important; 
      border-radius: 12px; 
      overflow: hidden; 
      position: relative;
      z-index: 1;
    }

    /* OCULTA EL TEXTO ORIGINAL DE LUNA RADIO */
    #extassisnetwork .songtitle,
    #extassisnetwork .song,
    #extassisnetwork .artist,
    #extassisnetwork .title,
    #extassisnetwork [class*="song"],
    #extassisnetwork [class*="artist"],
    #extassisnetwork [class*="title"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      height: 0 !important;
    }

    /* ANUNCIADOR DE CANCIÓN */
    .custom-song-display {
      position: absolute;
      top: 235px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      z-index: 99;
      background: transparent;
      border: none;
      box-shadow: none;
      text-align: center;
      box-sizing: border-box;
      pointer-events: none;
    }

    .song-label-indicator {
      font-size: 10px;
      font-weight: 700;
      color: var(--neon-color);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.9));
    }

    .song-label-indicator::before,
    .song-label-indicator::after {
      content: '';
      display: inline-block;
      width: 5px; height: 5px;
      background: var(--neon-color);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--neon-color);
      animation: pulseDot 1.5s infinite;
    }
    @keyframes pulseDot { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

    .current-song-text {
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1.2;
      background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowText 4s linear infinite;
      filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.9));
      margin: 0;
      word-break: break-word;
    }

    @keyframes rainbowText {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* BANNER DE POESÍA ROTATIVA */
    .poetry-banner-container {
      width: 90%;
      background: rgba(12, 9, 20, 0.75);
      border: 1px solid rgba(0, 243, 255, 0.25);
      border-radius: 12px;
      margin-top: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      z-index: 10;
      position: relative;
    }
    .poetry-icon { color: #00f3ff; font-size: 14px; filter: drop-shadow(0 0 6px #00f3ff); }
    .poetry-text {
      font-size: 12px;
      font-style: italic;
      color: #e0e0e0;
      text-align: center;
      transition: opacity 0.5s ease;
      letter-spacing: 0.5px;
    }

    /* HISTORIAL DE CANCIONES */
    .song-history-container {
      width: 90%;
      background: rgba(12, 9, 20, 0.85);
      border: 1px solid rgba(255, 0, 127, 0.25);
      border-radius: 12px;
      margin-top: 10px;
      overflow: hidden;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      z-index: 10;
      position: relative;
    }

    .history-header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--neon-color);
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.3);
      transition: background 0.3s;
    }

    .history-header:hover {
      background: rgba(255, 0, 127, 0.1);
    }

    .history-arrow {
      transition: transform 0.3s ease;
    }

    .history-list {
      max-height: 0;
      overflow-y: auto;
      transition: max-height 0.3s ease-in-out;
      padding: 0 14px;
    }

    .history-list.open {
      max-height: 150px;
      padding: 8px 14px;
    }

    .history-item {
      font-size: 11px;
      color: #cccccc;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-item.empty {
      text-align: center;
      color: #777777;
      font-style: italic;
    }

    /* REDES SOCIALES FLOTANTES */
    .player-social-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 12px 10px 4px 10px;
      background: transparent;
      border: none;
      box-shadow: none;
      z-index: 10;
      position: relative;
    }
    
    .player-social-link {
      font-size: 34px;
      text-decoration: none;
      display: inline-block;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: floatSocial 3s ease-in-out infinite alternate, rainbowText 4s linear infinite;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.3));
    }

    @keyframes floatSocial {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }

    .player-social-link:nth-child(2) { animation-delay: 0.3s; }
    .player-social-link:nth-child(3) { animation-delay: 0.6s; }
    .player-social-link:nth-child(4) { animation-delay: 0.9s; }

    .player-social-link:hover {
      transform: translateY(-8px) scale(1.35) rotate(-6deg);
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.8)) drop-shadow(0 0 20px rgba(0, 243, 255, 0.6));
    }

    .top-right-controls { position: fixed; top: 20px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; z-index: 9999; }
    .btn-install {
      background: rgba(15, 12, 25, 0.85); border: 1.5px solid var(--dark-border); color: #ffffff;
      padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer;
      display: none; align-items: center; gap: 6px; backdrop-filter: blur(5px); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 768px) {
      .brand-title { font-size: 26px; letter-spacing: 1px; }
      .brand-icon { font-size: 24px; }
      .brand-header-row { gap: 8px; }
      .live-dj-banner { flex-direction: column; text-align: center; }
      #extassisnetwork { height: 360px !important; }

      .custom-song-display { top: 210px; }
      .current-song-text { font-size: 14px; }
      .player-social-container { gap: 22px; }
      .player-social-link { font-size: 28px; }
    }
  </style>
</head>
<body>

  <div class="top-right-controls">
    <button class="btn-install" id="btnInstall">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
      </svg>
      Instalar App
    </button>
  </div>

  <div class="main-container">
    <!-- Banner superior -->
    <div class="live-dj-banner" id="liveDjBanner">
      <div class="brand-title-container">
        <div class="brand-header-row">
          <span class="brand-icon">🎙️✨</span>
          <h1 class="brand-title">Radio Magia y Poesia</h1>
          <span class="brand-icon">🎵✨</span>
        </div>
      </div>
    </div>

    <!-- Contenedor principal del reproductor -->
    <div class="player-wrapper" id="playerWrapper">
      
      <!-- REPRODUCTOR -->
      <div id="extassisnetwork"></div>

      <!-- ANUNCIADOR DE CANCIÓN -->
      <div class="custom-song-display">
        <div class="song-label-indicator">Sonando Ahora</div>
        <div class="current-song-text" id="liveSongTitle">Cargando Canción...</div>
      </div>

      <!-- CONTENEDOR DE ESTADÍSTICAS Y ESTADO EN VIVO -->
      <div class="stats-flex-container">
        <!-- Contador de Oyentes -->
        <div class="live-listeners-count">🎧 Oyentes: <span id="listenersCount">0</span></div>
        <!-- Indicador de Conexión en Vivo (Debajo) -->
        <div class="stream-status-badge">
          <span class="status-dot"></span> EN VIVO
        </div>
      </div>

      <!-- FRASES POÉTICAS DINÁMICAS -->
      <div class="poetry-banner-container" id="poetryBanner">
        <div class="poetry-icon"><i class="fas fa-feather-alt"></i></div>
        <div class="poetry-text" id="poetryText">"Donde la música termina, la poesía comienza..."</div>
      </div>

      <!-- HISTORIAL DE CANCIONES -->
      <div class="song-history-container">
        <div class="history-header" id="toggleHistory">
          <span><i class="fas fa-history"></i> Canciones Recientes</span>
          <i class="fas fa-chevron-down history-arrow" id="historyArrow"></i>
        </div>
        <div class="history-list" id="historyList">
          <div class="history-item empty">Esperando el historial...</div>
        </div>
      </div>

      <!-- REDES SOCIALES -->
      <div class="player-social-container">
        <a href="https://wa.me/TU_NUMERO_AQUI" target="_blank" class="player-social-link wa" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        <a href="https://instagram.com/TU_USUARIO" target="_blank" class="player-social-link ig" title="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="https://facebook.com/TU_PAGINA" target="_blank" class="player-social-link fb" title="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="https://tiktok.com/@TU_USUARIO" target="_blank" class="player-social-link tk" title="TikTok"><i class="fab fa-tiktok"></i></a>
      </div>
    </div>
  </div>

  <script>
    /* Service Worker para PWA */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
          .catch(err => console.log('Error al registrar Service Worker:', err));
      });
    }

    /* Evento instalación PWA */
    let deferredPrompt;
    const btnInstall = document.getElementById('btnInstall');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btnInstall.style.display = 'flex';
    });

    btnInstall.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('El usuario aceptó instalar la app');
        }
        deferredPrompt = null;
        btnInstall.style.display = 'none';
      }
    });

    window.addEventListener('appinstalled', () => {
      btnInstall.style.display = 'none';
      console.log('App instalada correctamente');
    });

    /* Inicialización Luna Radio */
    $("#extassisnetwork").lunaradio({
      streamurl: "https://streaming.viphosting.cl:8236",
      radioname: "",
      coverimage: "https://i.postimg.cc/VNgxvsk0/logo-removebg-preview.png",
      onlycoverimage: false,
      userinterface: "big",
      backgroundcolor: "rgba(15, 12, 25, 0.7)",
      fontcolor: "#ffffff",
      hightlightcolor: "#ff007f",
      fontname: "Be Vietnam",
      googlefont: "Be Vietnam",
      fontratio: "0.8",
      scroll: "false",
      coverstyle: "animated",
      usevisualizer: "real",
      visualizertype: "6",
      streamtype: "shoutcast2",
      shoutcastpath: "/stream",
      shoutcastid: "1",
      metadatainterval: "1000",
      volume: "100",
      autoplay: "false",
      usestreamcorsproxy: "true"
    });

    /* Desbloqueador de contexto de audio */
    document.addEventListener('click', function unlockAudio() {
      const audioElements = document.querySelectorAll('audio');
      audioElements.forEach(audio => {
        if (audio.paused) {
          audio.play().catch(() => {});
        }
      });
      document.removeEventListener('click', unlockAudio);
    }, { once: true });

    /* Frases poéticas rotativas */
    const frasesPoeticas = [
      "\"Donde la música termina, la poesía comienza...\"",
      "\"El arte de la música es el que más cercano está a las lágrimas y a los recuerdos.\"",
      "\"Las palabras son el eco de la música del alma.\"",
      "\"Donde las palabras abandonan, la música habla.\"",
      "\"Magia es todo aquello que nos hace sentir vivos a través del sonido.\""
    ];

    let indexFrase = 0;
    const poetryElement = document.getElementById('poetryText');

    setInterval(() => {
      indexFrase = (indexFrase + 1) % frasesPoeticas.length;
      poetryElement.style.opacity = 0;
      setTimeout(() => {
        poetryElement.innerText = frasesPoeticas[indexFrase];
        poetryElement.style.opacity = 1;
      }, 500);
    }, 10000);

    /* Control de apertura/cierre del acordeón de historial */
    const toggleHistory = document.getElementById('toggleHistory');
    const historyList = document.getElementById('historyList');
    const historyArrow = document.getElementById('historyArrow');

    toggleHistory.addEventListener('click', () => {
      historyList.classList.toggle('open');
      historyArrow.style.transform = historyList.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
    });

    /* Array para almacenar las últimas canciones y evitar duplicados */
    let songHistoryArray = [];
    const maxHistoryItems = 5;

    function agregarAlHistorial(nuevaCancion) {
      if (!nuevaCancion || nuevaCancion === "Cargando Canción..." || nuevaCancion.includes("RADIO")) return;
      
      if (songHistoryArray.length > 0 && songHistoryArray[0] === nuevaCancion) return;

      songHistoryArray.unshift(nuevaCancion);

      if (songHistoryArray.length > maxHistoryItems) {
        songHistoryArray.pop();
      }

      actualizarUIHistorial();
    }

    function actualizarUIHistorial() {
      if (songHistoryArray.length === 0) {
        historyList.innerHTML = '<div class="history-item empty">Aún no hay registros...</div>';
        return;
      }

      let htmlContent = '';
      for (let i = 1; i < songHistoryArray.length; i++) {
        htmlContent += `<div class="history-item"><i class="fas fa-music" style="font-size:9px; margin-right:6px; color:#ff007f;"></i> ${songHistoryArray[i]}</div>`;
      }

      if (htmlContent === '') {
        historyList.innerHTML = '<div class="history-item empty">Reproduciendo primera canción...</div>';
      } else {
        historyList.innerHTML = htmlContent;
      }
    }

    /* Extractor del nombre de canción */
    setInterval(() => {
      $("#extassisnetwork").find("div, span, p, a").each(function() {
        const classNames = $(this).attr("class") || "";
        const idName = $(this).attr("id") || "";
        if (
          classNames.includes("song") || 
          classNames.includes("title") ||
          idName.includes("song") ||
          idName.includes("title")
        ) {
          const txt = $(this).text().trim();
          if (txt.length > 2 && !txt.includes("RADIO")) {
            $("#liveSongTitle").text(txt);
            agregarAlHistorial(txt);
          }
        }
      });
    }, 800);

    /* Consulta de metadatos del streaming */
    function actualizarEstadisticas() {
      const elementListeners = document.getElementById('listenersCount');

      $.ajax({
        url: "https://streaming.viphosting.cl:8236/stats?sid=1&json=1",
        dataType: "jsonp",
        jsonpCallback: "parseMusicStats",
        timeout: 2500,
        success: function(data) {
          if (data) {
            if (data.currentlisteners !== undefined) elementListeners.innerText = data.currentlisteners;
            if (data.songtitle) {
              $("#liveSongTitle").text(data.songtitle);
              agregarAlHistorial(data.songtitle);
            }
          }
        },
        error: function() {
          $.ajax({
            url: "https://corsproxy.io/?" + encodeURIComponent("https://streaming.viphosting.cl:8236/stats?sid=1&json=1"),
            dataType: "json",
            timeout: 2000,
            success: function(data) {
              if (data) {
                if (data.currentlisteners !== undefined) elementListeners.innerText = data.currentlisteners;
                if (data.songtitle) {
                  $("#liveSongTitle").text(data.songtitle);
                  agregarAlHistorial(data.songtitle);
                }
              }
            }
          });
        }
      });
    }

    setInterval(actualizarEstadisticas, 3000);
    actualizarEstadisticas();
  </script>
